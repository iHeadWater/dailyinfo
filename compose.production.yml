# Content production only. MCP remains a separate read-only service.
services:
  freshrss:
    image: ${FRESHRSS_IMAGE:-freshrss/freshrss:1.30.4}
    container_name: dailyinfo-freshrss
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CRON_MIN: "*/15"
      ENABLE_ACCESS_LOG: "0"
      FRESHRSS_INSTALL: "--default-user=collector --db-type=sqlite --language=zh-cn --base-url=http://localhost"
    volumes:
      - type: bind
        source: ${DAILYINFO_DATA_ROOT:?Set the shared content root}/freshrss/data
        target: /var/www/FreshRSS/data
        bind:
          create_host_path: false
    # The image ships neither curl nor wget; php is the HTTP client it always
    # has. The scheduler waits for this check before replaying missed jobs.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # FreshRSS is an internal collector; no host port is published.
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scheduler:
    image: ${DAILYINFO_IMAGE:?Set the reviewed DailyInfo image}
    container_name: dailyinfo-scheduler
    restart: unless-stopped
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    # The image has no ENTRYPOINT; only this service runs the scheduler shell.
    entrypoint: ["/usr/local/bin/dailyinfo-scheduler"]
    env_file:
      - ${DAILYINFO_PRODUCER_ENV:?Set the restricted producer env file}
      # Full mode needs DISCORD_BOT_TOKEN and the channel ids here. Collect-only
      # deployments leave DAILYINFO_PUSH_ENV unset.
      - path: ${DAILYINFO_PUSH_ENV:-/dev/null}
        required: false
    environment:
      TZ: Asia/Shanghai
      DAILYINFO_SCHEDULER_TZ: Asia/Shanghai
      DAILYINFO_ENV: prod
      DAILYINFO_DATA_ROOT: /data
      FRESHRSS_USER: collector
      # Existing pipeline lookup falls back to USER when sources.json is unset.
      USER: collector
      DAILYINFO_PUBLICATION_GROUP_READ: "1"
      DAILYINFO_SCHEDULER_JOBS: ${DAILYINFO_SCHEDULER_JOBS:-full}
      # Static so the Docker healthcheck and `compose exec` see it too; the
      # entrypoint's export does not reach those processes.
      DAILYINFO_SCHEDULER_CRONTAB: /etc/dailyinfo/crontab.${DAILYINFO_SCHEDULER_JOBS:-full}
    volumes:
      - type: bind
        source: ${DAILYINFO_DATA_ROOT:?Set the shared content root}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      freshrss:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.scheduler", "healthcheck"]
      interval: 60s
      timeout: 20s
      start_period: 5m
      retries: 3
    # A run killed at stop is replayed by catch-up on the next start.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  collector:
    profiles: [jobs]
    image: ${DAILYINFO_IMAGE:?Set the reviewed DailyInfo image}
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    env_file:
      - ${DAILYINFO_PRODUCER_ENV:?Set the restricted producer env file}
    environment:
      TZ: Asia/Shanghai
      DAILYINFO_ENV: prod
      DAILYINFO_DATA_ROOT: /data
      FRESHRSS_USER: collector
      # Existing pipeline lookup falls back to USER when sources.json is unset.
      USER: collector
      DAILYINFO_PUBLICATION_GROUP_READ: "1"
    volumes:
      - type: bind
        source: ${DAILYINFO_DATA_ROOT:?Set the shared content root}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Manual debugging takes the same lock as the scheduled jobs; two writers
    # on one data root would corrupt the SQLite stores.
    command:
      [python, -m, scripts.scheduler, exec, --, python, -m, scripts.cli, run]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

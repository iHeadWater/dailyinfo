# Content production only. MCP remains a separate read-only service.
services:
  freshrss:
    image: ${FRESHRSS_IMAGE:-freshrss/freshrss:1.30.4}
    container_name: dailyinfo-freshrss
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CRON_MIN: "${FRESHRSS_CRON_MIN:-*/15}"
      ENABLE_ACCESS_LOG: "0"
      # No-op on an already-installed data directory; the account name comes
      # from FRESHRSS_USER in .env (default: collector). Do not also set
      # FRESHRSS_USER on this service: the image entrypoint feeds it to
      # create-user.php as CLI options, so a plain username aborts the boot.
      FRESHRSS_INSTALL: "--default-user=${FRESHRSS_USER:-collector} --db-type=sqlite --language=${FRESHRSS_LANGUAGE:-zh-cn} --base-url=${FRESHRSS_BASE_URL:-http://localhost}"
    ports:
      # Loopback by default; override FRESHRSS_BIND_ADDRESS/FRESHRSS_PORT in
      # .env to expose or move the Web UI. DailyInfo containers reach FreshRSS
      # over the compose network by name.
      - "${FRESHRSS_BIND_ADDRESS:-127.0.0.1}:${FRESHRSS_PORT:-8081}:80"
    volumes:
      - type: bind
        source: ${DAILYINFO_DATA_ROOT:?Set the shared content root}/freshrss/data
        target: /var/www/FreshRSS/data
        bind:
          create_host_path: false
    # The image ships neither curl nor wget; php is the HTTP client it always
    # has. The scheduler waits for this check before replaying missed jobs.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scheduler:
    image: ${DAILYINFO_IMAGE:?Set the reviewed DailyInfo image}
    container_name: dailyinfo-scheduler
    restart: unless-stopped
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    # The image has no ENTRYPOINT; only this service runs the scheduler shell.
    entrypoint: ["/usr/local/bin/dailyinfo-scheduler"]
    environment:
      TZ: Asia/Shanghai
      DAILYINFO_SCHEDULER_TZ: Asia/Shanghai
      DAILYINFO_ENV: prod
      DAILYINFO_DATA_ROOT: /data
      FRESHRSS_USER: "${FRESHRSS_USER:-collector}"
      # Existing pipeline lookup falls back to USER when sources.json is unset.
      USER: "${FRESHRSS_USER:-collector}"
      DAILYINFO_PUBLICATION_GROUP_READ: "1"
      DAILYINFO_SCHEDULER_JOBS: ${DAILYINFO_SCHEDULER_JOBS:-full}
      # Static so the Docker healthcheck and `compose exec` see it too; the
      # entrypoint's export does not reach those processes.
      DAILYINFO_SCHEDULER_CRONTAB: /etc/dailyinfo/crontab.${DAILYINFO_SCHEDULER_JOBS:-full}
      # Compose reads the project .env for interpolation, so credentials have a
      # single source and are never duplicated into deploy-only files.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      DAILYINFO_FALLBACK_MODEL: "${DAILYINFO_FALLBACK_MODEL:-}"
      OPENREVIEW_EMAIL: "${OPENREVIEW_EMAIL:-}"
      OPENREVIEW_PASSWORD: "${OPENREVIEW_PASSWORD:-}"
      OPENREVIEW_USERNAME: "${OPENREVIEW_USERNAME:-}"
      # Push credentials stay on the scheduler; the collector below omits them.
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CHANNEL_PAPERS: "${DISCORD_CHANNEL_PAPERS:-}"
      DISCORD_CHANNEL_AI_NEWS: "${DISCORD_CHANNEL_AI_NEWS:-}"
      DISCORD_CHANNEL_ARXIV: "${DISCORD_CHANNEL_ARXIV:-}"
      DISCORD_CHANNEL_CODE: "${DISCORD_CHANNEL_CODE:-}"
      DISCORD_CHANNEL_RESOURCE: "${DISCORD_CHANNEL_RESOURCE:-}"
      DISCORD_CHANNEL_CONFERENCE: "${DISCORD_CHANNEL_CONFERENCE:-}"
    volumes:
      - type: bind
        source: ${DAILYINFO_DATA_ROOT:?Set the shared content root}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      freshrss:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.scheduler", "healthcheck"]
      interval: 60s
      timeout: 20s
      # A cold start replays the day's jobs before supercronic starts.
      start_period: 30m
      retries: 3
    # A run killed at stop is replayed by catch-up on the next start.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  collector:
    profiles: [jobs]
    image: ${DAILYINFO_IMAGE:?Set the reviewed DailyInfo image}
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      TZ: Asia/Shanghai
      DAILYINFO_ENV: prod
      DAILYINFO_DATA_ROOT: /data
      FRESHRSS_USER: "${FRESHRSS_USER:-collector}"
      # Existing pipeline lookup falls back to USER when sources.json is unset.
      USER: "${FRESHRSS_USER:-collector}"
      DAILYINFO_PUBLICATION_GROUP_READ: "1"
      # Same .env source as the scheduler, minus the Discord credentials.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      DAILYINFO_FALLBACK_MODEL: "${DAILYINFO_FALLBACK_MODEL:-}"
      OPENREVIEW_EMAIL: "${OPENREVIEW_EMAIL:-}"
      OPENREVIEW_PASSWORD: "${OPENREVIEW_PASSWORD:-}"
      OPENREVIEW_USERNAME: "${OPENREVIEW_USERNAME:-}"
    volumes:
      - type: bind
        source: ${DAILYINFO_DATA_ROOT:?Set the shared content root}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Manual debugging takes the same lock as the scheduled jobs; two writers
    # on one data root would corrupt the SQLite stores.
    command:
      [python, -m, scripts.scheduler, exec, --, python, -m, scripts.cli, run]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

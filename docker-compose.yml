# DEV ONLY.
#
# Production runs the self-contained stack:
#   docker compose up -d            # compose.yml -> production + MCP
#
# This file exists for `dailyinfo start/stop/restart` during development. It
# publishes a host port and uses a separate container name and data directory.
# Do not point it at the production data root: a second FreshRSS writer on the
# same SQLite database corrupts it.
name: dailyinfo-dev

x-env-common: &env-common
  TZ: Asia/Shanghai
  CRON_MIN: "*/15"

services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: dailyinfo-freshrss-dev
    ports:
      # dev: 8082, staging: 8083, prod: 8081 (default)
      - "${FRESHRSS_PORT:-8081}:80"
    volumes:
      # Deliberately a dev-only variable: the production docs put
      # DAILYINFO_DATA_ROOT in .env, and Compose loads .env even with -f.
      - ${DAILYINFO_DEV_DATA_ROOT:-~/.myagentdata/dailyinfo-dev}/freshrss/data:/var/www/FreshRSS/data
    environment:
      <<: *env-common
    restart: always
    networks:
      - dailyinfo_dev_net

networks:
  dailyinfo_dev_net:
    driver: bridge

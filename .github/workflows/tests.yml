name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp

      # Three steps rather than three jobs: the suite takes seconds, so the
      # setup would dominate, and the step name already says which check failed.
      - name: Run the suite
        run: uv run --frozen --extra mcp pytest -q

      # CI has no .env, so CI never noticed that a value there changed test
      # outcomes. This makes it look like a configured machine.
      - name: Run the suite against a decoy .env
        run: |
          uv run --frozen --extra mcp python tests/decoy_env.py .env
          uv run --frozen --extra mcp pytest -q

      # Every fix on the branch that introduced this file landed with a
      # mutation that turns its test red, and every one of those mutations was
      # applied by hand. This is that discipline, mechanised.
      - name: Check that the guards can fail
        run: uv run --frozen --extra mcp python tests/mutation_probes.py

      # The merged stack is what a fresh machine runs; a schema error here is
      # invisible to the unit tests.
      - name: Validate the self-hosted compose stack
        run: |
          mkdir -p /tmp/dailyinfo-ci /tmp/mcp-secrets
          : > /tmp/producer.env
          DAILYINFO_DATA_ROOT=/tmp/dailyinfo-ci \
          DAILYINFO_IMAGE=dailyinfo-producer:ci \
          DAILYINFO_PRODUCER_ENV=/tmp/producer.env \
          DAILYINFO_MCP_SECRETS_DIR=/tmp/mcp-secrets \
          docker compose -f compose.yml config -q

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the producer image
        run: docker build -f Dockerfile.producer -t dailyinfo-producer:ci .

      # The collector overrides the command; an image-level ENTRYPOINT would
      # turn that override into arguments to supercronic.
      - name: Assert the image has no entrypoint
        run: |
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' dailyinfo-producer:ci)" = "null"

      - name: Assert tzdata and the scheduler wrapper work
        run: |
          docker run --rm --entrypoint python dailyinfo-producer:ci -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Asia/Shanghai'))"
          docker run --rm \
            -e DAILYINFO_DATA_ROOT=/tmp/data \
            -e DAILYINFO_SCHEDULER_JOBS=collect \
            -e DAILYINFO_SCHEDULER_CRONTAB=/etc/dailyinfo/crontab.collect \
            --entrypoint python dailyinfo-producer:ci -m scripts.scheduler verify-env
          docker run --rm --entrypoint supercronic dailyinfo-producer:ci -help | grep -q passthrough-logs
          # No entrypoint exports here: this is what the Docker healthcheck
          # and `compose exec` actually see.
          docker run --rm \
            -e DAILYINFO_DATA_ROOT=/tmp/data \
            -e DAILYINFO_SCHEDULER_JOBS=collect \
            --entrypoint python dailyinfo-producer:ci -m scripts.scheduler healthcheck

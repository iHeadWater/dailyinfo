[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyinfo"
version = "0.2.0"
description = "Daily briefing pipeline: scrape → AI summary → Discord push"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Wenyu Ouyang" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "click>=8.1",
    "scikit-learn>=1.3",
    "openreview-py>=2.4,<3",
    "tzdata>=2024.1; platform_system == 'Windows'",  # zoneinfo needs tzdata on Windows
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "ruff>=0.4",
    "pytest>=8",
]
embedding = [
    "fastapi>=0.115",
    "torch>=2.5",
    "transformers>=4.51",
    "uvicorn>=0.34",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
dailyinfo = "scripts.cli:cli"
dailyinfo-embedding-server = "scripts.qwen_embedding_service:main"
dailyinfo-embedding-benchmark = "scripts.benchmark_embedding_retrieval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.uv]
dev-dependencies = [
    "black>=26.3.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
